    description: "Reach real estate professionals for lead gen and CRM services"
    niche_keywords: ["real estate", "realtor", "realty", "real estate broker", "real estate agent"]
    steps:
      - subject: "Quick thought for {{company_name}}"
        body: |
          Hey {{first_name}},

          I noticed {{company_name}} in {{city}} and wanted to reach out. I've been working with real estate teams on {building a lead pipeline that doesn't depend on Zillow or Realtor.com|setting up CRM automations that turn cold leads into closed deals}.

          Most agents I talk to are {spending a fortune on portal leads and barely breaking even|drowning in leads but struggling to convert them because follow-up falls through the cracks}. We've put together a system that {generates seller and buyer leads exclusively for your market|automates your entire follow-up process so no lead gets forgotten}.

          Would you have 10 minutes for a quick call? I think there's an opportunity for {{company_name}} and I'd love to run it by you.

          Talk soon,
          {{sender_name}}
        delay_days: 0

      - subject: "Re: Quick thought for {{company_name}}"
        body: |
          {{first_name}},

          Following up on my email from a few days ago. I know {the market has been wild lately|you're probably busy showing homes and closing deals}, so I'll be brief.

          A real estate team in a market similar to {{city}} used our system to {close 8 additional deals in their first quarter|cut their cost per lead by 60% while doubling their pipeline}. The whole thing integrates with {your existing CRM|whatever tools you're already using} so there's basically no learning curve.

          Worth a quick chat to see if it could work for your team?

          {{sender_name}}
        delay_days: 3

      - subject: "Re: Quick thought for {{company_name}}"
        body: |
          Hey {{first_name}},

          Last note from me. I know real estate is all about timing, and maybe right now isn't the right moment.

          If you ever want to explore {a better way to generate and convert leads|getting more listings without buying overpriced portal leads}, feel free to reach out. I'm always happy to chat, even if it's months from now.

          {Wishing you a strong closing season.|Hope you have a great rest of the year.}

          {{sender_name}}
        delay_days: 5

  # ============================================================
