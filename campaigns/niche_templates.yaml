        delay_days: 5

  # ============================================================
  # PRIVATE CLINICS
  # ============================================================
  - name: "Private Clinic Outreach"
    description: "Reach private clinics for patient acquisition and marketing services"
    niche_keywords: ["clinic", "private practice", "medical practice", "urgent care", "med spa"]
    steps:
      - subject: "Patient acquisition for {{company_name}}"
        body: |
          Hi {{first_name}},

          I was researching private clinics in {{city}} and {{company_name}} caught my eye. {Your patient reviews speak volumes about the care you provide|Great to see a practice that clearly prioritizes patient experience}.

          I work with private clinics on {filling their schedule with new patients|building a patient acquisition system that runs on autopilot}. The practices I work with were typically {spending a lot on ads with inconsistent results|relying mostly on referrals and word of mouth, which is great but hard to scale}.

          Would you or your practice manager have 10 minutes for a quick call? I'd love to share a few strategies that have been working well for clinics in similar markets. No pressure, just a conversation.

          Best,
          {{sender_name}}
        delay_days: 0

      - subject: "Re: Patient acquisition for {{company_name}}"
        body: |
          Hey {{first_name}},

          Just wanted to follow up on my note from earlier this week. I know running a practice leaves {very little time for anything else|zero free time}.

          Here's the quick version: we helped a private clinic in a market like {{city}} go from {20 new patients a month to 45+|struggling to fill afternoon slots to being booked out 2 weeks}. The system handles {online presence, review management, and targeted outreach|everything from Google visibility to automated appointment reminders}.

          If that sounds relevant, I'm happy to walk you through it. If not, no worries at all.

          {{sender_name}}
        delay_days: 3

      - subject: "Re: Patient acquisition for {{company_name}}"
        body: |
          Hi {{first_name}},

          Last email from me on this — I promise.

          I put together a {short overview|quick guide} on how clinics in markets like {{city}} are {attracting more patients online|growing without relying solely on referrals}. Happy to share it if you're interested, no strings attached.

          Either way, I hope {{company_name}} continues to thrive. {Feel free to reach out anytime if things change.|My door is always open if you want to chat down the road.}

          {{sender_name}}
        delay_days: 5

  # ============================================================
  # REAL ESTATE (Estate Lynx)
  # ============================================================
