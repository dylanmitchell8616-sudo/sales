    description: "Reach trades and blue collar businesses for lead gen and marketing"
    niche_keywords: ["plumber", "plumbing", "electrician", "electrical", "contractor", "handyman", "landscap"]
    steps:
      - subject: "Getting more jobs for {{company_name}}"
        body: |
