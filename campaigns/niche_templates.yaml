          If that sounds useful, let's talk for 10 minutes. If not, no hard feelings at all.

          {{sender_name}}
        delay_days: 3

      - subject: "Re: Getting more jobs for {{company_name}}"
        body: |
          Hey {{first_name}},

          Last email from me on this. I don't want to be a pest.

          If growing {{company_name}} is something you're focused on right now, I'd love to help. If the timing's off, I totally get it — {my inbox is open whenever you're ready|feel free to reach out down the road}.

          {Hope business is booming.|Wishing you a great rest of the season.}

          {{sender_name}}
        delay_days: 5
