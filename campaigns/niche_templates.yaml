# Niche-Specific Email Sequences
# Tailored outreach templates for each vertical
# Variables: {{first_name}}, {{company_name}}, {{city}}, {{sender_name}}, {{sender_company}}

sequences:
  # ============================================================
  # DENTAL OFFICES
  # ============================================================
  - name: "Dental Office Outreach"
    description: "Reach dental offices for marketing/AI services"
    niche_keywords: ["dental", "dentist", "orthodont", "dental office", "dental practice"]
    steps:
      - subject: "Quick question about {{company_name}}"
        body: |
          Hi {{first_name}},

          I was looking at dental practices in {{city}} and came across {{company_name}}. {Looks like you've built a solid practice|Really liked what I saw}.

          I work with a handful of dental offices on {their digital marketing and patient acquisition|using AI tools to streamline their front desk and fill more chairs}. One thing that keeps coming up is how much time gets wasted on {no-shows and missed follow-ups|chasing down leads that never book}.

          Would you be open to a quick 10-minute call this week? I have a few ideas that might be worth exploring — no pitch, just want to see if there's a fit.

          Best,
          {{sender_name}}
        delay_days: 0

      - subject: "Re: Quick question about {{company_name}}"
        body: |
          Hey {{first_name}},

          Just bumping this up in case it got buried. I know running a practice keeps you {slammed|incredibly busy}.

          The short version: we've been helping dental offices in markets like {{city}} {book 15-30 more appointments per month|cut no-show rates by 30-40%} without adding any extra work for the front desk.

          If that sounds interesting, I'm happy to walk you through how it works — takes about 10 minutes.

          Either way, no worries at all.

          {{sender_name}}
        delay_days: 3

      - subject: "Re: Quick question about {{company_name}}"
        body: |
          Hi {{first_name}},

          Last note from me on this — I don't want to be that person who keeps following up forever.

          I put together a {quick breakdown|short case study} of what we did for a dental office similar to yours. Happy to send it over if you're curious, zero strings attached.

          If the timing isn't right, totally understand. Feel free to reach out whenever.

          Thanks,
          {{sender_name}}
        delay_days: 5

  # ============================================================
  # HVAC COMPANIES
  # ============================================================
  - name: "HVAC Company Outreach"
    description: "Reach HVAC companies for lead generation and marketing services"
    niche_keywords: ["hvac", "heating and cooling", "air conditioning", "furnace"]
    steps:
      - subject: "Filling your schedule in {{city}}"
        body: |
          Hey {{first_name}},

          I've been working with a few HVAC companies and one thing I keep hearing is that {getting consistent leads is the hardest part of the business|the slow seasons are brutal for cash flow}.

          We've put together a system that {generates exclusive leads for HVAC companies|keeps the phone ringing year-round} in markets like {{city}} — no shared leads, no Angi nonsense.

          Would you have 10 minutes this week for a quick call? I can show you exactly how it works and you can decide if it makes sense for {{company_name}}.

          Talk soon,
          {{sender_name}}
        delay_days: 0

      - subject: "Re: Filling your schedule in {{city}}"
        body: |
          {{first_name}},

          Just wanted to follow up on my last note. I know you're probably {out on jobs all day|busy running crews} so I'll keep this short.

          We helped an HVAC company in a market similar to {{city}} go from {scrambling for work to turning down jobs|spending $3k/mo on ads with nothing to show for it, to booking 20+ jobs a month}. The whole thing runs on autopilot once it's set up.

          Worth a quick conversation? I promise I won't waste your time.

          {{sender_name}}
        delay_days: 3

      - subject: "Re: Filling your schedule in {{city}}"
        body: |
          Hey {{first_name}},

          I'll keep this one short — just wanted to send one more note before I move on.

          If lead flow is something {{company_name}} is working on right now, I'd love to chat. If not, no hard feelings at all.

          {Either way, hope you guys have a killer season ahead.|Wishing you a great rest of the quarter.}

          {{sender_name}}
        delay_days: 5

  # ============================================================
  # ROOFING CONTRACTORS
  # ============================================================
  - name: "Roofing Contractor Outreach"
    description: "Reach roofing contractors for lead generation and marketing"
    niche_keywords: ["roofing", "roofer", "roof repair", "roof replacement"]
    steps:
      - subject: "More roofing jobs in {{city}}?"
        body: |
          Hey {{first_name}},

          Found {{company_name}} while looking into roofing companies in {{city}}. {Looks like you guys do great work|Nice reviews — clearly you take care of your customers}.

          I work with roofing contractors on {getting more estimates booked without relying on word of mouth|building a lead gen system that actually produces real jobs, not tire-kickers}. Most of the guys I talk to are either {paying too much for shared leads on HomeAdvisor|stuck relying on referrals and yard signs}.

          Would it be worth a 10-minute call to see if we could help {{company_name}} book more jobs this {season|quarter}? No contracts or commitments, just a conversation.

          Best,
          {{sender_name}}
        delay_days: 0

      - subject: "Re: More roofing jobs in {{city}}?"
        body: |
          {{first_name}},

          Quick follow-up — I know roofing season keeps you {on rooftops, not checking email|crazy busy}.

          Here's the deal: we set up a system that sends {exclusive roofing leads|homeowners actively looking for roof work} directly to you in your service area. No sharing with 5 other contractors. You get the lead, you close the deal.

          A contractor we work with in a similar market is averaging {12-20 new estimates per month|$40-60k in new revenue monthly} from this.

          Worth a quick chat? I can walk you through the whole thing in under 10 minutes.

          {{sender_name}}
        delay_days: 3

      - subject: "Re: More roofing jobs in {{city}}?"
        body: |
          Hey {{first_name}},

          Last follow-up from me. I know you're busy and I respect that.

          If getting more roofing jobs in {{city}} is on your radar, I'd love to have a quick conversation. If not, I totally get it — feel free to {reach out anytime down the road|keep my info in case things change}.

          Good luck out there,
          {{sender_name}}
        delay_days: 5

