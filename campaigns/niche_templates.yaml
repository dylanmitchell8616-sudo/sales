          I work with trades businesses on {getting a steady flow of new customers without relying on word of mouth|building a marketing system that keeps the phone ringing even in the slow months}. Most of the guys I work with were in the same spot — {great at the work, but marketing felt like throwing money into a black hole|tired of paying for shared leads that go nowhere}.

          Would you be up for a 10-minute call to see if there's a way to get {{company_name}} more jobs? No sales pitch, just want to see if we can help.

