          Quick stat that might be relevant: we helped an agency similar to yours {increase their quote-to-bind ratio by 25%|add 30+ new policies per month} just by {automating their follow-up sequence|fixing how they handle inbound leads}. The whole thing took about a week to set up.

          If that sounds interesting, I'd love to walk you through it. 10 minutes, tops.

